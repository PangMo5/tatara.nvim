[package]
name = "tatara-fff"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
fff-query-parser = { git = "https://github.com/dmtrKovalenko/fff", rev = "977102516557c29a1ed92fa3792384f353f652a3", default-features = false }
neo_frizbee = { version = "=0.13.3", features = ["match_end_col"] }
globset = "=0.4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
