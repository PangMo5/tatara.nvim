name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.25
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: gitleaks git . --log-opts=--all --redact
      - run: swift Scripts/Tatara.swift toolchain
      - run: swift Scripts/Tatara.swift resolve
      - run: swift Scripts/Tatara.swift localizations --check
      - run: swift Scripts/Tatara.swift test
      - run: swift Scripts/Tatara.swift build release
      - run: swift Scripts/Tatara.swift nvim-test
      - run: swift Scripts/Tatara.swift nvim-smoke
      - run: swift Scripts/Tatara.swift lint
