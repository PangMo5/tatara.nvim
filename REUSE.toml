version = 1

[[annotations]]
path = ["**", ".*"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 PangMo5 and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["Package.resolved", "Scripts/NvimSmoke/Package.resolved", "Native/FFFBridge/Cargo.lock"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["Native/FFFBridge/Rust-LICENSE-MIT.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["ThirdParty/FFFBridge/LICENSE.txt", "ThirdParty/FFFBridge/TataraFFF.xcframework/**/*.a"]
precedence = "override"
SPDX-FileCopyrightText = "See ThirdParty/FFFBridge/LICENSE.txt"
SPDX-License-Identifier = "AGPL-3.0-only AND MIT AND Unicode-3.0"
